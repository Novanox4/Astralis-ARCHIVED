unit.astralis-unit-flu.name=Gripe
unit.astralis-unit-flu.description=Aranha nativa de Astralis. Ataca regurgitando ácido contra os alvos.
unit.astralis-unit-flu.details=Essas aranhas evoluíram um sistema de defesa rudimentar, regurgitando ácido estomacal e catapultando-o contra qualquer coisa que considerem uma ameaça. Como estão recém-saídas do estágio de casulo, esse é seu único meio de sobrevivência. Testes indicaram que são altamente inteligentes, algumas raramente até superando humanos, evidenciado pelo fato de se cobrirem com carvão como forma de camuflagem em biomas escuros ou à noite. Talvez futuros encontros com essa espécie sejam mais complicados.

# Endereço: ./content/units/biological/unit-koreni.hjson
unit.astralis-unit-koreni.name=Koreni
unit.astralis-unit-koreni.description=Unidade biológica em forma de verme. Esmaga construções sob seu corpo. Cria unidades menores ao morrer.

# Endereço: ./content/units/biological/unit-lumbricus.hjson
unit.astralis-unit-lumbricus.name=Lumbricus
unit.astralis-unit-lumbricus.description=Unidade biológica em forma de verme. Esmaga construções sob seu corpo e cospe ferrões letais. Cria unidades menores ao morrer.

# Endereço: ./content/units/biological/unit-malady.hjson
unit.astralis-unit-malady.name=Enfermidade
unit.astralis-unit-malady.description=Aranha nativa de Astralis. Usa um grande canhão de artilharia para disparar.
unit.astralis-unit-malady.details=Um canhão está montado nas costas desta aranha. Estranho. Deve ter sido instalado pelos Fragmentados como uma tentativa de criar uma unidade biomecânica. Eles tiveram sucesso até certo ponto. Tenha em mente que, mesmo sendo grande, esta ainda é [sotaque]uma infante[].

# Endereço: ./content/units/biological/unit-microplana.hjson
unit.astralis-unit-microplana.name=Microplana
unit.astralis-unit-microplana.description=Unidade biológica em forma de verme. Esmaga construções sob seu corpo.

# Endereço: ./content/units/biological/unit-outbreak.hjson
unit.astralis-unit-outbreak.name=Surto
unit.astralis-unit-outbreak.description=Aranha nativa de Astralis. Usa uma série de canhões para disparar. Frágil, mas protegida por um escudo enquanto atira.
unit.astralis-unit-outbreak.details=Investigações de carcaças mostram que o metal usado para reforço não é de origem da Hell Inc. As implicações são... no mínimo intrigantes.

# --- Unidades Normais ---

# Endereço: ./content/units/unit-capture.hjson
unit.astralis-unit-capture.name=Captura
unit.astralis-unit-capture.description=Unidade aérea de assalto. Bombardeia defesas inimigas com balas. Causa pouco dano, mas é ágil.

# Endereço: ./content/units/unit-chieftain.hjson
unit.astralis-unit-chieftain.name=Cacique
unit.astralis-unit-chieftain.description=Unidade aérea de assalto. Ataca usando mísseis.

# Endereço: ./content/units/unit-chunk-drone.hjson
unit.astralis-unit-healer-drone.name=Drone Curador
unit.astralis-unit-healer-drone.description=Repara construções e unidades próximas.

unit.astralis-unit-chunks.name=Fragmentos
unit.astralis-unit-chunks.description=Defensor do Núcleo: Agora. Melhor que a iteração anterior, mas incapaz de atacar. Constrói drones curadores para ajudar na reparação de estruturas danificadas. Pode carregar blocos.

# Endereço: ./content/units/unit-clusters.hjson
unit.astralis-unit-clusters.name=Aglomerados
unit.astralis-unit-clusters.description=Defensor do Núcleo: Castelo. Melhor que a iteração anterior, uma mistura das versões anteriores. Constrói drones curadores para ajudar na reparação de estruturas e possui dois campos elétricos poderosos.

# Endereço: ./content/units/unit-draugr.hjson
unit.astralis-unit-draugr.name=Draugr
unit.astralis-unit-draugr.description=Navio naval feito para atacar bases rapidamente. Libera rajadas de vapor pressurizado. Frágil, mas rápido e poderoso.

# Endereço: ./content/units/unit-hue.hjson
unit.astralis-unit-prism.name=Prisma
unit.astralis-unit-prism.description=Dispara um raio de energia que se divide em 7 projéteis teleguiados. Pode impulsionar e construir.

# Endereço: ./content/units/unit-lord.hjson
unit.astralis-unit-lord.name=Senhor
unit.astralis-unit-lord.description=Unidade aérea de assalto. Muito resistente e lenta. Ataca lançando bombas em rápida sucessão. Fica muito mais rápida enquanto ataca.

# Endereço: ./content/units/unit-pollen.hjson
unit.astralis-unit-pollen.name=Pólen
unit.astralis-unit-pollen.description=Meca-aranha que dispara uma barragem de projéteis de energia e lasers.

# Endereço: ./content/units/unit-poltergeist.hjson
unit.astralis-unit-poltergeist.name=Poltergeist
unit.astralis-unit-poltergeist.description=Navio naval feito para atacar bases rapidamente. Ataca com um canhão de mísseis.

# Endereço: ./content/units/unit-receptacle.hjson
unit.astralis-unit-receptacle.name=Recipiente
unit.astralis-unit-receptacle.description=Meca-aranha que usa um laser contínuo para atacar. Cura aliados próximos.

# Endereço: ./content/units/unit-refraction.hjson
unit.astralis-unit-refraction.name=Refração
unit.astralis-unit-refraction.description=Dispara poderosos raios laser e se protege com um escudo de energia. Pode impulsionar e construir. Muito rápida ao impulsionar. Esmaga construções sob si.

# Endereço: ./content/units/unit-shards.hjson
unit.astralis-unit-shards.name=Estilhaços
unit.astralis-unit-shards.description=Defensor do Núcleo: Fortaleza. Ágil e capaz de construir e curar, mas com poucas capacidades ofensivas.

# Endereço: ./content/units/unit-spectrum.hjson
unit.astralis-unit-spectrum.name=Espectro
unit.astralis-unit-spectrum.description=Dispara um raio de luz teleguiado. Pode construir, minerar e impulsionar.

# Endereço: ./content/units/unit-stamina.hjson
unit.astralis-unit-stamina.name=Resistência
unit.astralis-unit-stamina.description=Poderoso meca de cinco pernas. Constrói unidades de nível inferior. Dispara fortes raios de energia.

# Endereço: ./content/units/unit-stem.hjson
unit.astralis-unit-stem.name=Caule
unit.astralis-unit-stem.description=Meca-aranha que pode construir, reparar e atacar construções, enquanto protege unidades aliadas com escudo. Ataca usando armas duplas de energia ricocheteante e um canhão laser.
unit.astralis-unit-stem.details=Trecho contém mistura de idiomas e versos obscuros. Tradução não recomendada integralmente por conter conteúdo sensível.

# Endereço: ./content/units/unit-tlilocatl.hjson
unit.astralis-unit-tlilocatl.name=Tlilocatl
unit.astralis-unit-tlilocatl.description=Se desprende de suas pernas, propulsionando seu corpo como um míssil explosivo de uso único.
unit.astralis-unit-tlilocatl.details=NNNNNNNNYYYYYYYYOOOOOOOOOOOOOOMMMMMMMMMMMMMMMMM

# Endereço: ./content/units/unit-vibrance.hjson
unit.astralis-unit-vibrance.name=Vibração
unit.astralis-unit-vibrance.description=Ataca com uma rápida rajada de projéteis helicoidais. Pode construir e impulsionar.

# Endereço: ./content/units/unit-viceroy.hjson
unit.astralis-unit-viceroy.name=Vice-rei
unit.astralis-unit-viceroy.description=Grande aeronave robusta capaz de carregar cargas muito grandes. Armada com uma poderosa metralhadora. Pode ocasionalmente ficar mais rápida enquanto dispara.

# --- Unidades: Vazio ---

# Endereço: ./content/units/void/unit-bellatrix.hjson
unit.astralis-unit-bellatrix.name=Bellatrix
unit.astralis-unit-bellatrix.description=Mariposa criada pelo vazio. Possui uma incrível variedade de ataques. Extremamente perigosa.

# Endereço: ./content/units/void/unit-blob.hjson
unit.astralis-unit-blob.name=Bolha
unit.astralis-unit-blob.description=Massa rastejante de fluido do vazio. Cura-se rapidamente em poças de vazio.
unit.astralis-unit-blob.details=Forma de vida muito primitiva. Estranhamente, espécimes capturados e testados parecem demonstrar alta inteligência e até possível consciência. Como pode surgir vida de um mero líquido? Como o nada pode se tornar tudo?

# Endereço: ./content/units/void/unit-carrier-moth.hjson
unit.astralis-unit-carrier-moth.name=Mariposa Transportadora
unit.astralis-unit-carrier-moth.description=Mariposa criada pelo vazio. Transporta recursos.

# Endereço: ./content/units/void/unit-craving.hjson
unit.astralis-unit-craving.name=Ânsia
unit.astralis-unit-craving.description=Aranha abissal. Ataca esmagando construções.
unit.astralis-unit-craving.details=Parece estranhamente inteligente para um monte de gosma em movimento.

# Endereço: ./content/units/void/unit-hunger.hjson
unit.astralis-unit-hunger.name=Fome
unit.astralis-unit-hunger.description=Aranha abissal. Ataca explodindo em fluido do vazio.

# Endereço: ./content/units/void/unit-voracity.hjson
unit.astralis-unit-voracity.name=Voracidade
unit.astralis-unit-voracity.description=Horrível amálgama de cadáveres e fluido do vazio coagulado. Altamente perigosa.
unit.astralis-unit-voracity.details=Codinome: V-14. Nome comum: Voracidade. Nome científico: *Impius Aranea*. Poucos exemplares foram capturados e testados. Os ossos encontrados em seu interior mostram semelhança inquietante com restos humanos, mas também parecem completamente anômalos e sem propósito. Possui uma quantidade muito alta de saúde, mas pouca armadura, sendo altamente suscetível a muitos ataques fracos, como os projéteis da Vertigem ou um Malheur com munição de metavidro.

# Endereço: ./content/units/void/unit-wilt.hjson
unit.astralis-unit-wilt.name=Definhamento
unit.astralis-unit-wilt.description=Mariposa criada pelo vazio. Ataca arremetendo-se contra construções. Voa alto demais para ser danificada adequadamente, mas fica altamente vulnerável após atacar.

