unit.astralis-unit-endemic.description=Aranha nativa [cinza](?)[] de Astralis. Altamente perigosa. Dispara mísseis poderosos e orbes de energia de sua mandíbula mecânica. Extremamente resistente, gera unidades ao morrer.
unit.astralis-unit-endemic.details=Esta criatura é tão grande que está apodrecendo por dentro. É a maior aranha já encontrada no planeta; a Hell Inc. deve ter realmente a irritado, considerando seu estado agressivo.  

Essa monstruosidade não poderia ter surgido naturalmente, poderia? TEM que ser um experimento fragmentado que deu errado, certo? CERTO?

