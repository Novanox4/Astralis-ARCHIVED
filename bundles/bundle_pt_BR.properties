# Endereço: ./content/sectors/bog.hjson
sector.astralis-bog.name=Pântano
sector.astralis-bog.description=[sotaque][SINAL ENTRANTE][]
[Mensagem recebida do superintendente TARTAR-us]

Um trecho de [sotaque]cicatriz do vazio[] foi detectado, junto com lagos de fluido do vazio, uma substância incrivelmente viscosa e volátil com usos potentes em sua forma sólida, muito mais estável.

Espere inimigos de unidades de quarto nível. Explore os recursos potentes do setor e defenda-se do ataque.

# Endereço: ./content/sectors/burning-ravine.hjson
sector.astralis-burning-ravine.name=Ravina Ardente
sector.astralis-burning-ravine.description=[sotaque][SINAL ENTRANTE][]
[Mensagem recebida do superintendente TARTAR-us]

Grandes quantidades de carvão em chamas e água foram detectadas aqui.

As ameaças biológicas são baixas, mas presentes.

Unidades fragmentadas a caminho. Pesquise melhores armamentos e meios de produção. Comece a produzir [sotaque]metavidro[] e utilize água para melhorar a infraestrutura.

# Endereço: ./content/sectors/crimp.hjson
sector.astralis-crimp.name=Crimp
sector.astralis-crimp.description=[sotaque][SINAL ENTRANTE][]
[Mensagem recebida do superintendente TARTAR-us]
[vermelho][BASE INIMIGA DETECTADA][]

Uma operação de extração de fluido do vazio está localizada aqui.

Chuvas intensas e artificiais foram induzidas pela Hell Inc. para multiplicar rapidamente o fluido do vazio. Espere unidades aéreas de quarto nível.

Devido ao terreno altamente fechado, o uso de unidades aéreas e aceleradores magnéticos pode ser necessário.

# Endereço: ./content/sectors/delta.hjson
sector.astralis-delta.name=Delta
sector.astralis-delta.description=[sotaque][SINAL ENTRANTE][]
[Mensagem recebida do superintendente TARTAR-us]

[vermelho][BASE INIMIGA DETECTADA][]

Uma instalação de pesquisa foi detectada em um setor remoto e aquático.

Grande parte da nossa tecnologia foi desativada, então você deve usar [sotaque]unidades navais[] para atacar a base.

Torres de longo alcance foram detectadas. Tente usar paredes e unidades para distraí-las enquanto lança um ataque surpresa.

O urânio é bastante escasso aqui, assim como o espaço disponível.

[sotaque]Este setor é opcional e não é necessário para completar a campanha principal e terminar a história![]

# Endereço: ./content/sectors/emergence.hjson
sector.astralis-emergence.name=Emergência
sector.astralis-emergence.description=Bem-vindo a Astralis. Este é um setor fraco que você pode usar para começar sua jornada. Aprenda a usar os materiais disponíveis e expanda.

# Endereço: ./content/sectors/explosive-armaments-facility.hjson
sector.astralis-explosive-armaments-facility.name=Instalação de Armamentos Explosivos
sector.astralis-explosive-armaments-facility.description=[sotaque][SINAL ENTRANTE][]
[Mensagem recebida do superintendente TARTAR-us]
[vermelho][BASE INIMIGA DETECTADA][]

Uma instalação fragmentada dedicada à criação de novas e poderosas armas explosivas está localizada aqui.
Os recursos são abundantes, mas também as ameaças.
Ninhos de escória estão presentes, mas provavelmente serão destruídos pelos ataques fragmentados.
[sotaque]Desbloqueie fulminato de prata, um explosivo potente, e produza-o. Bombardeios inimigos são uma possível ameaça.
Este setor é opcional e não é necessário para completar a campanha principal e terminar a história![]

# Endereço: ./content/sectors/infestation.hjson
sector.astralis-infestation.name=Infestação
sector.astralis-infestation.description=[sotaque][SINAL ENTRANTE][]
[Mensagem recebida do superintendente TARTAR-us]
[azul-marinho][AMEAÇAS BIOLÓGICAS EXTENSAS DETECTADAS][]

Ei, você não tem medo de aranhas, né?

Talvez precisemos atravessar um centro de transporte da Hell Inc. infestado de aranhas gigantes. Podemos estar fugindo de nossos inimigos após uma de nossas grandes naves transportadoras ter caído no oceano, que deveria levar recursos para nossa base, e por acaso continha coordenadas de algumas de nossas bases...

Normalmente você não seria enviado para um setor tão perigoso com seu nível de tecnologia, mas não temos escolha. Este é o caminho mais rápido e (comparativamente) mais seguro que não deixará nossas bases vulneráveis.

[sotaque]É assim que deve ser. Boa sorte.[]

[Transmissão encerrada]

[ardósia]Você ouve algo respirando profundamente dentro das rochas[]

# Endereço: ./content/sectors/mineshaft.hjson
sector.astralis-mineshaft.name=Mina
sector.astralis-mineshaft.description=[sotaque][SINAL ENTRANTE][]
[Mensagem recebida do superintendente TARTAR-us]
[vermelho][BASE INIMIGA DETECTADA][]

Uma grande operação de mineração de prata foi descoberta. As ameaças biológicas são maiores do que antes, tenha cuidado.

Pesquise e utilize a [sotaque]Forja de Unidade de Assalto[] e ataque a base inimiga encontrada. Extraia prata e use-a para pesquisar novas tecnologias.

[sotaque]Ninhos de escória[] estão presentes aqui, e unidades biológicas surgirão logo em seguida. Elas atacarão primeiro as bases da Hell Inc. e provavelmente não focarão em você.

# Endereço: ./content/sectors/remnants.hjson
sector.astralis-remnants.name=Remanescentes
sector.astralis-remnants.description=[sotaque][SINAL ENTRANTE][]
[Mensagem recebida do superintendente TARTAR-us]

Uma antiga operação de mineração de [sotaque]monazita[] existia aqui. Embora a monazita seja [sotaque]inútil em construções, ela é um ingrediente-chave para produzir novos materiais[].

Esta área é fortemente guardada, mas pode levar um tempo até ser detectada. Os inimigos atacarão em poucos grupos densos. Espere unidades de nível 3.

Produza neodímio e cério, melhore a infraestrutura e sobreviva às ondas.

# Endereço: ./content/sectors/sector-gate.hjson
sector.astralis-sector-gate.name=Portão
sector.astralis-sector-gate.description=[sotaque][SINAL ENTRANTE][]
[Mensagem recebida do superintendente TARTAR-us]
[vermelho][BASE INIMIGA DETECTADA][]

Este setor é dividido em diferentes 'segmentos' conectados devido à sua geologia.

Falhas sísmicas reacenderam grande parte do carvão, permitindo ao inimigo fazer algumas... escolhas questionáveis de design em como obter calor para suas bases.

As bases estão totalmente protegidas por escudos, ataques aéreos podem ser extremamente difíceis.

[sotaque]Muitas torres Vertigem foram detectadas aqui, mas não devem representar uma ameaça.[]

# Endereço: ./content/sectors/strait.hjson
sector.astralis-strait.name=Estreito
sector.astralis-strait.description=[sotaque][SINAL ENTRANTE][]
[Mensagem recebida do superintendente TARTAR-us]
[vermelho][BASE INIMIGA DETECTADA][]

Uma fábrica de unidades muito poderosa está localizada aqui, ou pelo menos estava. A fábrica foi negligenciada e sobrecarregada com quantidades desnecessárias de construções, causando danos severos à infraestrutura da instalação. Não a subestime, ainda pode representar uma séria ameaça.

Pesquise e [sotaque]construa unidades de terceiro nível[] para destruir a base. Isso ajudará a enfraquecer as capacidades de produção da Hell Inc. e abrir caminho para conquistarmos mais setores.

