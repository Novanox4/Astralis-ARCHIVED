# Endereço: ./content/status/lore/lore-log-1.hjson
lore.astralis-lore-log-1.name=Registro de Lore: Ravina Ardente
lore.astralis-lore-log-1.description=Um contêiner forte e reforçado. Ele contém uma tábua de cristal imaculada que projeta texto holograficamente:
lore.astralis-lore-log-1.details=[sotaque]REGISTRO #1: DA EQUIPE DE EXPLORAÇÃO #8, REPORTANDO DE VOLTA À NAVE PRINCIPAL DA BASE REBELDE. ENVIANDO AO SUPERINTENDENTE TARTAR-us.[]
Nosso pouso em Astralis foi muito difícil, embora a vista e as informações dentro da atmosfera tenham valido o tumulto. Nossa equipe suspeita que uma tempestade eletromagnética de nível lhetirask nos tirou do curso, e acabamos caindo em uma fenda profunda com terreno rochoso.  
A atmosfera de Astralis parece ser capaz de sustentar vida, também. Grandes estacas de cristal estão presentes aqui, e parece que o material poderia ser usado para construir infraestrutura básica. Urânio 235 também está presente, mas inspeções geológicas básicas não mostram nenhum traço.  
Se outros fatores forem favoráveis, este lugar pode ser um esconderijo perfeito.

